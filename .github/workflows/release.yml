name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build Colon.app (universal, ad-hoc signed)
        env:
          SIGN_IDENTITY: "-"
          COLON_VERSION: ${{ env.TAG }}
          COLON_BUILD: ${{ github.run_number }}
        run: scripts/build-app.sh

      - name: Package zip and DMG
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Colon.app "dist/Colon-$VERSION.zip"
          scripts/make-dmg.sh
          cd dist && shasum -a 256 Colon-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Colon ${TAG#v}" --generate-notes \
              $([[ "$TAG" == *-* ]] && echo --prerelease)
          fi
