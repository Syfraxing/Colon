name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.3.0. Dispatch from the tag itself (the release environment only admits v* refs): gh workflow run release.yml --ref v0.3.0 -f tag=v0.3.0"
        required: true
      update_feed:
        description: Also publish appcast.xml (only for re-running the newest release)
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time, never cancelled midway: the feed check and the appcast upload
# must not interleave with another run.
concurrency:
  group: release-feed
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: macos-latest
    timeout-minutes: 45
    # Holds COLON_SIGNING_P12, COLON_SIGNING_P12_PASSWORD (the Developer ID Application
    # certificate), NOTARY_API_KEY, NOTARY_KEY_ID, NOTARY_ISSUER_ID (App Store Connect API
    # key, Developer role) and SPARKLE_ED_PRIVATE_KEY, deployable from v* tags only.
    environment: release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      BUILD: ${{ github.run_number }}
      REPO_URL: https://github.com/${{ github.repository }}
      FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
      # The Developer ID identity, given by name so build-app.sh adds the secure timestamp
      # notarization needs, and the designated requirement it must produce. The requirement
      # names the team, not the certificate, so renewing the certificate keeps updates and
      # privacy grants working; changing team or bundle ID breaks both.
      SIGN_IDENTITY: 'Developer ID Application: Hunter Nathaniel Claycomb (MD396T2MTR)'
      TEAM_ID: MD396T2MTR
      PINNED_REQUIREMENT: identifier "so.slayer.Colon" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = MD396T2MTR
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Release kind
        env:
          EVENT: ${{ github.event_name }}
          UPDATE_FEED: ${{ inputs.update_feed }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag '$TAG' is not vX.Y.Z[-pre]"; exit 1; }
          VERSION="${TAG#v}"
          PRERELEASE=false; [[ "$TAG" == *-* ]] && PRERELEASE=true
          # Feed candidates: tag pushes of final releases, or an explicit re-run.
          PUBLISH_FEED=false
          if [[ "$PRERELEASE" == false ]] && { [[ "$EVENT" == push ]] || [[ "$UPDATE_FEED" == true ]]; }; then
            PUBLISH_FEED=true
          fi
          # The feed only moves forward. A final tag older than the published release
          # (a backport) ships as a normal, non-latest release without touching the feed.
          if [[ "$PUBLISH_FEED" == true ]]; then
            status=0
            scripts/check-feed-forward.sh "$FEED_URL" "$BUILD" "$VERSION" || status=$?
            if (( status == 3 )); then
              if [[ "$EVENT" == push ]]; then
                echo "::warning::$TAG is older than the published release; publishing it without updating the feed."
                PUBLISH_FEED=false
              else
                echo "::error::update_feed was requested, but $TAG would move the feed backwards."
                exit 1
              fi
            elif (( status != 0 )); then
              exit "$status"
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
          echo "PUBLISH_FEED=$PUBLISH_FEED" >> "$GITHUB_ENV"
          echo "version $VERSION, build $BUILD, prerelease $PRERELEASE, publish feed $PUBLISH_FEED"

      # Everything that runs build code happens before any secret is touched.
      - name: Test
        run: swift test --only-use-versions-from-resolved-file

      - name: Compile (universal)
        env:
          COLON_RELEASE: '1'
        run: scripts/build-app.sh --compile-only

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.COLON_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.COLON_SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/colon-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "ORIGINAL_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | xargs)" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Recorded at once so the cleanup step deletes it even if a later command fails.
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          P12="$RUNNER_TEMP/colon-signing.p12"
          (umask 077 && printf '%s' "$P12_BASE64" | base64 --decode > "$P12")
          # `security import` only takes the passphrase as an argument (-P) or from a GUI
          # prompt; on this single-use runner it is visible to this job's processes only.
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "\"$SIGN_IDENTITY\"" \
            || { echo "::error::signing identity $SIGN_IDENTITY not in the imported certificate"; exit 1; }

      - name: Build Colon.app (universal, release-signed)
        env:
          COLON_RELEASE: '1'
          COLON_VERSION: ${{ env.TAG }}
          COLON_BUILD: ${{ github.run_number }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY || secrets.SPARKLE_PUBLIC_KEY }}
        run: scripts/build-app.sh

      - name: Verify signature, architectures and update key
        run: |
          APP=build/Colon.app
          codesign --verify --deep --strict "$APP"
          REQUIREMENT="$(codesign -d -r- "$APP" 2>&1 | sed -n 's/^designated => //p')"
          [[ "$REQUIREMENT" == "$PINNED_REQUIREMENT" ]] \
            || { echo "::error::designated requirement is '$REQUIREMENT'"; exit 1; }
          INFO="$(codesign -dv "$APP" 2>&1)"
          grep -q 'flags=.*runtime' <<<"$INFO" || { echo "::error::app lacks the hardened runtime"; exit 1; }
          grep -qx "TeamIdentifier=$TEAM_ID" <<<"$INFO" || { echo "::error::app is not signed by team $TEAM_ID"; exit 1; }
          grep -q '^Timestamp=' <<<"$INFO" || { echo "::error::app signature has no secure timestamp"; exit 1; }
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Colon")"
          [[ " $ARCHS " == *" arm64 "* && " $ARCHS " == *" x86_64 "* ]] \
            || { echo "::error::not universal: $ARCHS"; exit 1; }
          [[ -d "$APP/Contents/Frameworks/Sparkle.framework" ]] || { echo "::error::Sparkle.framework missing"; exit 1; }
          KEY="$(plutil -extract SUPublicEDKey raw "$APP/Contents/Info.plist")"
          [[ "$KEY" != SPARKLE_PUBLIC_KEY_PLACEHOLDER ]] || { echo "::error::SUPublicEDKey is the placeholder"; exit 1; }
          echo "$REQUIREMENT, $ARCHS"

      - name: Write notarization key
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
        run: |
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          (umask 077 && printf '%s\n' "$NOTARY_API_KEY" > "$NOTARY_KEY_PATH")
          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Notarize and staple Colon.app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          scripts/notarize.sh build/Colon.app
          spctl --assess --type execute --verbose=2 build/Colon.app

      # The zip (Sparkle's update archive) and the DMG both carry the stapled app.
      - name: Package zip and DMG
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Colon.app "dist/Colon-$VERSION.zip"
          scripts/make-dmg.sh

      - name: Notarize and staple DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          scripts/notarize.sh "dist/Colon-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "dist/Colon-$VERSION.dmg"
          cd dist && shasum -a 256 Colon-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Delete signing keychain
        if: always()
        run: |
          if [[ -n "${ORIGINAL_KEYCHAINS:-}" ]]; then
            security list-keychains -d user -s $ORIGINAL_KEYCHAINS
          else
            security list-keychains -d user -s ~/Library/Keychains/login.keychain-db
          fi
          if [[ -n "${KEYCHAIN:-}" && -f "$KEYCHAIN" ]]; then security delete-keychain "$KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/colon-signing.p12" "$RUNNER_TEMP/notary-key.p8"

      - name: Generate appcast
        if: env.PUBLISH_FEED == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          scripts/make-appcast.sh build/Colon.app "dist/Colon-$VERSION.zip" \
            "$REPO_URL/releases/download/$TAG/Colon-$VERSION.zip" \
            "$REPO_URL/releases/tag/$TAG" \
            "$RUNNER_TEMP/appcast.xml"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$PUBLISH_FEED" == true ]]; then
            # Re-check right before anything is uploaded, so a failed check never leaves a
            # replaced archive behind a stale appcast.
            scripts/check-feed-forward.sh "$FEED_URL" "$BUILD" "$VERSION"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The live appcast may point at this release's zip; only a run that also
            # publishes a matching appcast may replace it.
            if [[ "$PUBLISH_FEED" != true ]]; then
              echo "::error::release $TAG already exists; refusing to replace its assets without publishing the feed (re-run with update_feed, or delete the release first)."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            # Created as a draft so "latest" never points at a release without its appcast.
            FLAGS=(--draft --title "Colon $VERSION" --generate-notes)
            [[ "$PRERELEASE" == true ]] && FLAGS+=(--prerelease)
            gh release create "$TAG" dist/* "${FLAGS[@]}"
          fi
          if [[ "$PUBLISH_FEED" == true ]]; then
            # The appcast goes up last, after the archive it points to.
            gh release upload "$TAG" "$RUNNER_TEMP/appcast.xml" --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false --latest=false
          fi
